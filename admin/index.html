<!doctype html><html lang="fr-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#245fa8"><link rel="stylesheet" href="../styles.css"><title>Administration — La classe de Monsieur Dinsart</title></head><body><main class="admin-wrap"><header class="admin-head"><h1>Administration</h1><p>La classe de Monsieur Dinsart</p></header><section id="loginCard" class="card"><form id="loginForm" class="form"><div><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Se connecter</button><div id="loginResult" class="result hidden" role="status"></div></form></section><section id="adminCard" class="card hidden"><div class="metric"><strong id="subscriberCount">—</strong><span>appareils abonnés</span></div><form id="sendForm" class="form"><div><label for="title">Titre</label><input id="title" maxlength="70" placeholder="Ex. Excursion demain" required></div><div><label for="message">Message</label><textarea id="message" maxlength="350" placeholder="Ex. N’oubliez pas le pique-nique, la gourde et une veste." required></textarea></div><button id="sendBtn" class="btn btn-primary" type="submit">ENVOYER LA NOTIFICATION</button><div id="sendResult" class="result hidden" role="status"></div></form><p class="admin-note">Les parents peuvent uniquement recevoir la notification. Cette interface n’est jamais affichée dans l’application parents.</p><button id="logoutBtn" class="btn btn-light" style="width:100%;margin-top:10px">Se déconnecter</button></section></main><script src="../config.js"></script><script type="module" src="admin.js"></script></body></html>
